<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Digital Warranty Vault – dashboard preview illustration</title>
  <desc id="desc">A tasteful dark UI mock showing a sidebar and cards, used as a non-broken hero preview image.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1200" y2="675">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feBlend in="SourceGraphic" in2="blur" mode="normal"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Framing gradient border -->
  <rect x="40" y="40" width="1120" height="595" rx="24" fill="#0b1220" stroke="url(#border)" stroke-width="2"/>

  <!-- Window top bar -->
  <g transform="translate(64,64)">
    <rect width="1072" height="28" rx="8" fill="#0f172a"/>
    <circle cx="14" cy="14" r="5" fill="#ef4444"/>
    <circle cx="32" cy="14" r="5" fill="#f59e0b"/>
    <circle cx="50" cy="14" r="5" fill="#22c55e"/>
  </g>

  <!-- Sidebar -->
  <g transform="translate(64,112)">
    <rect width="220" height="500" rx="12" fill="#0f172a"/>
    <rect x="16" y="20" width="188" height="16" rx="8" fill="#1f2937"/>
    <rect x="16" y="52" width="160" height="12" rx="6" fill="#1f2937"/>
    <rect x="16" y="76" width="176" height="12" rx="6" fill="#1f2937"/>
    <rect x="16" y="100" width="130" height="12" rx="6" fill="#1f2937"/>
    <rect x="16" y="140" width="188" height="38" rx="10" fill="#0ea5e9" opacity="0.18"/>
    <rect x="16" y="190" width="188" height="12" rx="6" fill="#1f2937"/>
    <rect x="16" y="214" width="170" height="12" rx="6" fill="#1f2937"/>
    <rect x="16" y="238" width="156" height="12" rx="6" fill="#1f2937"/>
  </g>

  <!-- Main content area -->
  <g transform="translate(308,112)">
    <rect width="828" height="500" rx="12" fill="#0f172a"/>

    <!-- Header row -->
    <rect x="24" y="24" width="260" height="20" rx="10" fill="#1f2937"/>
    <rect x="300" y="24" width="160" height="20" rx="10" fill="#1f2937"/>

    <!-- KPI cards -->
    <g>
      <rect x="24" y="70" width="240" height="120" rx="14" fill="url(#card)"/>
      <rect x="284" y="70" width="240" height="120" rx="14" fill="url(#card)"/>
      <rect x="544" y="70" width="240" height="120" rx="14" fill="url(#card)"/>

      <rect x="44" y="92" width="140" height="14" rx="7" fill="#334155"/>
      <rect x="44" y="114" width="90" height="28" rx="8" fill="#60a5fa" opacity="0.25"/>

      <rect x="304" y="92" width="150" height="14" rx="7" fill="#334155"/>
      <rect x="304" y="114" width="100" height="28" rx="8" fill="#34d399" opacity="0.25"/>

      <rect x="564" y="92" width="160" height="14" rx="7" fill="#334155"/>
      <rect x="564" y="114" width="110" height="28" rx="8" fill="#f472b6" opacity="0.25"/>
    </g>

    <!-- Table/list -->
    <g>
      <rect x="24" y="214" width="760" height="44" rx="10" fill="#101826" stroke="#1f2937"/>
      <rect x="24" y="266" width="760" height="44" rx="10" fill="#101826" stroke="#1f2937"/>
      <rect x="24" y="318" width="760" height="44" rx="10" fill="#101826" stroke="#1f2937"/>
      <rect x="24" y="370" width="760" height="44" rx="10" fill="#101826" stroke="#1f2937"/>

      <!-- Cells -->
      <rect x="44" y="228" width="180" height="16" rx="8" fill="#334155"/>
      <rect x="260" y="228" width="120" height="16" rx="8" fill="#334155"/>
      <rect x="404" y="228" width="80" height="16" rx="8" fill="#334155"/>
      <rect x="508" y="222" width="110" height="28" rx="8" fill="#22d3ee" opacity="0.25"/>

      <rect x="44" y="280" width="160" height="16" rx="8" fill="#334155"/>
      <rect x="260" y="280" width="100" height="16" rx="8" fill="#334155"/>
      <rect x="404" y="280" width="90" height="16" rx="8" fill="#334155"/>
      <rect x="508" y="274" width="110" height="28" rx="8" fill="#22d3ee" opacity="0.25"/>

      <rect x="44" y="332" width="180" height="16" rx="8" fill="#334155"/>
      <rect x="260" y="332" width="120" height="16" rx="8" fill="#334155"/>
      <rect x="404" y="332" width="80" height="16" rx="8" fill="#334155"/>
      <rect x="508" y="326" width="110" height="28" rx="8" fill="#22d3ee" opacity="0.25"/>

      <rect x="44" y="384" width="160" height="16" rx="8" fill="#334155"/>
      <rect x="260" y="384" width="100" height="16" rx="8" fill="#334155"/>
      <rect x="404" y="384" width="90" height="16" rx="8" fill="#334155"/>
      <rect x="508" y="378" width="110" height="28" rx="8" fill="#22d3ee" opacity="0.25"/>
    </g>
  </g>

  <!-- Glow accents -->
  <ellipse cx="260" cy="120" rx="180" ry="40" fill="#60a5fa" opacity="0.08" filter="url(#soft)"/>
  <ellipse cx="980" cy="620" rx="200" ry="50" fill="#14b8a6" opacity="0.08" filter="url(#soft)"/>
</svg>

